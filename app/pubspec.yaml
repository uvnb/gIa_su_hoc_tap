name: cu_to_mo
description: "Cú Tò Mò – gia sư AI cho học sinh tiểu học (không bao giờ nói đáp án)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# ⚠️ VERIFY: kiểm tra phiên bản mới nhất trên pub.dev (flutter pub outdated) rồi ghim lại.
# flutter_riverpod giữ nhánh 2.x vì code dùng StateNotifier (bản 3.x chuyển StateNotifier sang legacy).
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  camera: ^0.11.0+2
  image: ^4.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  web: ^1.1.0
  record: ^7.2.0
  path_provider: ^2.1.6
  sherpa_onnx: 1.12.29

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/music/
    - assets/tts/vi/
    - assets/tts/vi/espeak-ng-data/
    - assets/tts/vi/espeak-ng-data/lang/aav/
    - assets/tts/vi/espeak-ng-data/lang/gmw/

# path_provider_android 2.3.x dùng package:jni – trên máy tính bảng (Android 11) bản build kèm
# sherpa_onnx bị lỗi "ClassNotFoundException android/content/Context" ngay lúc mở app.
# Giữ bản 2.2.x (kênh method channel, không cần jni) – đã chạy ổn định.
dependency_overrides:
  path_provider_android: 2.2.17
  # sherpa-onnx ≥ 1.12.30 kèm ONNX Runtime ≥ 1.23 (nhân KleidiAI) → lỗi SIGILL trên chip cũ Cortex-A53
  # (MT8765 của Tab 10 Edu). 1.12.29 là bản cuối dùng ONNX Runtime 1.17.1 – chạy được trên ARMv8.0.
  sherpa_onnx_android: 1.12.29
